<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
		<link rel="stylesheet" href="./styles/styles.css">
	</head>

	<body>
		<div class="main-div">
			<div class="generate-button-and-settings">
				<button onclick="generateRandomChord()">Generate New</button>

				<label>
					<input type="checkbox" id="pedal-checkbox" name="pedal-checkbox" checked>
					Use pedal to generate new chord
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="28" id="slider-major" name="slider-major">
					Major
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="12" id="slider-minor" name="slider-minor">
					Minor
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="1" id="slider-diminished" name="slider-diminished">
					Diminished
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="6" id="slider-major7" name="slider-major7">
					Major Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="6" id="slider-dominant7" name="slider-dominant7">
					Dominant Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="4" id="slider-minor7" name="slider-minor7">
					Minor Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="1" id="slider-half-diminished7" name="slider-half-diminished7">
					Half Diminished Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="32" value="1" id="slider-diminished7" name="slider-diminished7">
					Diminished Seven
				</label>
			</div>

			<textarea readonly style="resize: none" id="chord-textarea">---</textarea>

            <div class="piano">
                <button class="white-key" style="left: calc(0 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(1 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(2 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(3 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(4 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(5 * var(--white-key-width));"></button>
                <button class="white-key" style="left: calc(6 * var(--white-key-width));"></button>

                <button class="black-key" style="left: calc(0.75 * var(--white-key-width));"></button>
                <button class="black-key" style="left: calc(1.75 * var(--white-key-width));"></button>
                <button class="black-key" style="left: calc(3.75 * var(--white-key-width));"></button>
                <button class="black-key" style="left: calc(4.75 * var(--white-key-width));"></button>
                <button class="black-key" style="left: calc(5.75 * var(--white-key-width));"></button>
            </div>
		</div>
	</body>

	<script src="./scripts/main.js"></script>

</html>
