<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
		<link rel="stylesheet" href="./styles/styles.css">
	</head>

	<body>
		<div class="main-div">
			<div class="generate-button-and-settings">
				<button class="generate-button" onclick="generateRandomChord()">Generate New</button>

				<label>
					<input type="checkbox" id="pedal-checkbox" name="pedal-checkbox" checked>
					Use pedal to generate new chord
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="100" id="slider-major" name="slider-major">
                    <input type="number" class="number-input">
					Major
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="20" id="slider-minor" name="slider-minor">
					Minor
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="1" id="slider-diminished" name="slider-diminished">
					Diminished
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="30" id="slider-major7" name="slider-major7">
					Major Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="30" id="slider-dominant7" name="slider-dominant7">
					Dominant Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="30" id="slider-minor7" name="slider-minor7">
					Minor Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="5" id="slider-half-diminished7" name="slider-half-diminished7">
					Half Diminished Seven
				</label>

				<label>
					<input type="range" class="slider-input" min="0" max="100" value="5" id="slider-diminished7" name="slider-diminished7">
					Diminished Seven
				</label>
			</div>

			<textarea readonly style="resize: none" id="chord-textarea">---</textarea>

            <div id="piano">
                <button id="key_0"  onclick="onPianoKeyClicked(0);"  class="white-key" style="left: calc(0 * var(--white-key-width));"></button>
                <button id="key_2"  onclick="onPianoKeyClicked(2);"  class="white-key" style="left: calc(1 * var(--white-key-width));"></button>
                <button id="key_4"  onclick="onPianoKeyClicked(4);"  class="white-key" style="left: calc(2 * var(--white-key-width));"></button>
                <button id="key_5"  onclick="onPianoKeyClicked(5);"  class="white-key" style="left: calc(3 * var(--white-key-width));"></button>
                <button id="key_7"  onclick="onPianoKeyClicked(7);"  class="white-key" style="left: calc(4 * var(--white-key-width));"></button>
                <button id="key_9"  onclick="onPianoKeyClicked(9);"  class="white-key" style="left: calc(5 * var(--white-key-width));"></button>
                <button id="key_11" onclick="onPianoKeyClicked(11);" class="white-key" style="left: calc(6 * var(--white-key-width));"></button>

                <button id="key_1"  onclick="onPianoKeyClicked(1);"  class="black-key" style="left: calc((1 - 7/16) * var(--white-key-width));"></button>
                <button id="key_3"  onclick="onPianoKeyClicked(3);"  class="black-key" style="left: calc((2 - 5/16) * var(--white-key-width));"></button>
                <button id="key_6"  onclick="onPianoKeyClicked(6);"  class="black-key" style="left: calc((4 - 4/8) * var(--white-key-width));"></button>
                <button id="key_8"  onclick="onPianoKeyClicked(8);"  class="black-key" style="left: calc((5 - 3/8) * var(--white-key-width));"></button>
                <button id="key_10" onclick="onPianoKeyClicked(10);" class="black-key" style="left: calc((6 - 2/8) * var(--white-key-width));"></button>
            </div>
		</div>
	</body>

	<script src="./scripts/main.js"></script>

</html>
